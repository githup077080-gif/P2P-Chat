name: Android APK Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-apks:
    name: Build and Verify P2P CHAT 3.0 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_DIR" ]; then
            echo "ANDROID_SDK_ROOT / ANDROID_HOME is not set"
            exit 1
          fi
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR"
            exit 1
          fi
          mkdir -p "$SDK_DIR/licenses"
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK not found at $APK_PATH"
            exit 1
          fi
          
          echo "Checking APK size..."
          ls -lh "$APK_PATH"
          
          echo "Testing APK zip integrity..."
          unzip -t "$APK_PATH" || { echo "Error: APK failed zip integrity test"; exit 1; }
          
          echo "Verifying AndroidManifest.xml inside APK..."
          unzip -q "$APK_PATH" AndroidManifest.xml -d /tmp/apk_manifest
          if [ ! -f /tmp/apk_manifest/AndroidManifest.xml ]; then
            echo "Error: AndroidManifest.xml not found in APK"
            exit 1
          fi
          
          echo "Locating apksigner..."
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Running apksigner verify..."
            "$APKSIGNER" verify --verbose "$APK_PATH" || { echo "Error: APK signature verification failed"; exit 1; }
          else
            echo "Warning: apksigner not found, checking with jarsigner..."
            jarsigner -verify -verbose -certs "$APK_PATH" || { echo "Error: jarsigner verification failed"; exit 1; }
          fi
          
          echo "Generating SHA-256 checksum..."
          sha256sum "$APK_PATH" > "${APK_PATH}.sha256"
          cat "${APK_PATH}.sha256"
          
          echo "APK verification passed successfully!"

      - name: Upload Verified Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2P-CHAT-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
